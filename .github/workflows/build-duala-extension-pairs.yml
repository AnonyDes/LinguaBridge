name: Build experimental Duala extension lookup
on:
  push:
    branches: [main]
    paths:
      - 'linguabridge/scripts/build_duala_extension_pairs.py'
      - 'linguabridge/docs/research/duala-english-parallel-dictionary.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python linguabridge/scripts/build_duala_extension_pairs.py
      - name: Commit generated lookup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add linguabridge/packages/translation-engine/src/providers/duala-research-pairs.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: build experimental Duala extension lookup'
            git push
          fi
