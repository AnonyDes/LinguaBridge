version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: lb_postgres
    environment:
      POSTGRES_DB: linguabridge
      POSTGRES_USER: lb
      POSTGRES_PASSWORD: lb_dev_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lb -d linguabridge"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lb_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: lb_libretranslate
    ports:
      - "5000:5000"
    environment:
      LT_LOAD_ONLY: "fr,en"
      LT_DISABLE_WEB_UI: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/languages || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  pgdata:
