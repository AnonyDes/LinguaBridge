<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LinguaBridge Assistant</title>
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      margin: 0;
      font-size: 13px;
      color: #1f2937;
    }
    h2 {
      font-size: 15px;
      margin: 0 0 10px 0;
      color: #2563eb;
    }
    .metric {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid #f3f4f6;
    }
    .label {
      font-weight: 500;
      color: #6b7280;
    }
    .value {
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h2>LinguaBridge Assistant</h2>
  <div class="metric">
    <span class="label">API Gateway:</span>
    <span class="value" id="api-status">Connecting...</span>
  </div>
  <div class="metric">
    <span class="label">Languages:</span>
    <span class="value" id="lang-count">Checking...</span>
  </div>
  <div class="metric">
    <span class="label">Cameroon Packs:</span>
    <span class="value" style="color: #d97706;">5 Templates (Isolated)</span>
  </div>
  <script type="module" src="dist/popup.js"></script>
</body>
</html>
